<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MPNW Crew">
<title>MPNW Crew Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Archivo;font-style:normal;font-weight:400 900;font-stretch:85% 100%;font-display:swap;src:url(fonts/archivo.woff2) format('woff2')}
/* VOICE: plain, sure-footed foreman's clipboard
   IDEA: the job folder clipped to the truck dash: where, when, what goes on the wall
   PICTURE: the day's job card with a big Navigate button; products as spec rows
   COLOUR and TYPE: MPNW black + muted forest green #3b5e4a (logo keeps its brand green), safety amber for crew notes; Archivo (the logo font)
   LAYOUT: phone app: black header band, white cards, bottom tab bar */
:root{color-scheme:light dark;
--bg:#eff1ec;--card:#fff;--ink:#141815;--mute:#5b645d;
--line:#dfe3dc;--soft:#f3f5f1;--green:#3b5e4a;--green2:#3b5e4a;--tint:#edf2ee;--tintline:#d2dfd6;--tintink:#2f4c3c;
--amber:#fff4d6;--amberline:#f0c24b;--amberink:#5d4300;
--band:#141815;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0d100e;--card:#171b18;--ink:#e9ede9;--mute:#97a29a;--line:#262c27;--soft:#1d221e;--green2:#9cc4a8;--tint:#18211b;--tintline:#2b3a30;--tintink:#b3d0bd;--amber:#2e2610;--amberline:#7a6223;--amberink:#f3d27a}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Archivo,system-ui,-apple-system,sans-serif;font-stretch:100%;-webkit-font-smoothing:antialiased;overflow-x:clip}
body{padding-bottom:calc(74px + var(--sab))}
button,input{font:inherit;color:inherit}button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--green2);outline-offset:2px}
[hidden]{display:none!important}
.w{width:min(640px,calc(100% - 28px));margin:0 auto}
/* header */
.band{background:var(--band);color:#eef2ee;padding:calc(var(--sat) + 10px) 0 18px}
.band,.who{position:relative;overflow:hidden;isolation:isolate}
.topo{-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);position:absolute;left:0;top:var(--sat);width:100%;height:calc(100% - var(--sat));overflow:visible;z-index:-1;pointer-events:none;font-family:inherit}
.band.tall{padding-bottom:64px}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.logo{font-weight:900;font-size:21px;letter-spacing:-.01em;line-height:1}
.logo i{font-style:italic;color:#4fb576;font-weight:900}
.logo small{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;color:#9aa69d;margin-top:3px}
.icb{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#eef2ee;display:grid;place-items:center}
.hi{margin:16px 0 0}
.hi h1{margin:0;font-size:30px;line-height:1.1;font-weight:850;font-stretch:92%;letter-spacing:-.01em}
.hi p{margin:4px 0 0;color:#aab5ad;font-size:15px}
.upd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#8e9a91;margin-top:8px}
.upd.off{color:#f0c24b}
/* cards */
.lift{margin-top:-48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card.hero{box-shadow:0 24px 44px -28px rgba(0,0,0,.55);border-color:transparent}
.kick{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--green2);text-transform:uppercase}
.kick .time{margin-left:auto;font-size:15px;letter-spacing:0;color:var(--ink);text-transform:none;font-variant-numeric:tabular-nums}
.jn{font-size:25px;line-height:1.12;font-weight:850;font-stretch:90%;margin:8px 0 4px;letter-spacing:-.01em}
.sm .jn{font-size:19px}
.meta{color:var(--mute);font-size:14.5px}
.addr{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:15px}
.addr svg{flex:none;margin-top:2px;color:var(--mute)}
.btns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px;margin-top:14px}
.btn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:16px;padding:0 12px;white-space:nowrap}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn svg{flex:none}
.with{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink);white-space:nowrap}
.chip.me{background:var(--green);border-color:var(--green);color:#fff}
.note{margin-top:12px;background:var(--amber);border:1px solid var(--amberline);color:var(--amberink);border-radius:14px;padding:10px 12px;font-size:14.5px;display:flex;gap:8px}
.note svg{flex:none;margin-top:2px}
.empty{color:var(--mute);font-size:15px}
.sec{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:20px 2px 0}
/* week */
.wk{display:flex;align-items:center;gap:8px;margin-top:14px}
.wk b{flex:1;text-align:center;font-size:16px}
.wk button{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#eef2ee;display:grid;place-items:center}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;color:#aab5ad;font-weight:750}
.seg button[aria-pressed=true]{background:#fff;color:#141815}
.day{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.day.now{border-color:var(--green2);box-shadow:0 0 0 1px var(--green2)}
.dh{display:flex;align-items:baseline;gap:8px;padding:12px 14px 6px;font-weight:850}
.dh span{color:var(--mute);font-weight:600;font-size:14px}
.dh em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--green);border-radius:999px;padding:2px 9px}
.as{display:grid;grid-template-columns:62px minmax(0,1fr);gap:2px 10px;padding:10px 14px 12px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.as .t{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.as .n{font-weight:750;font-size:16px}
.as .c{grid-column:2;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.as .x{grid-column:2;color:var(--mute);font-size:13.5px;margin-top:4px}
.dn{padding:2px 14px 12px;color:var(--mute);font-size:14.5px}
/* jobs */
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:0 12px;margin-top:14px}
.search input{flex:1;border:0;background:none;color:#fff;height:48px;font-size:16px;outline:none}
.search input::placeholder{color:#8e9a91}
.jl{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:8px}
.jl .n{font-weight:800;font-size:16px;line-height:1.25}
.jl .m{color:var(--mute);font-size:13.5px;margin-top:3px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px;background:var(--soft);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.on{background:var(--tint);border-color:var(--tintline);color:var(--tintink)}
/* job page */
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:0;background:none;color:#cfd8d1;font-weight:700;padding:0 6px 0 0}
.jp h1{margin:6px 0 0;font-size:27px;line-height:1.12;font-weight:850;font-stretch:90%}
.jp p{margin:6px 0 0;color:#aab5ad;font-size:14.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:15px;margin-top:4px}
.kv dt{color:var(--mute);font-size:13.5px;padding-top:1px}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--green2);font-weight:750;text-decoration:none}
.sp{border-top:1px solid var(--line);padding:12px 0}
.sp:first-of-type{border-top:0;padding-top:4px}
.sp .a{font-size:12.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)}
.sp .s{font-size:15px;margin-top:2px}
.sp .p{font-weight:800;font-size:15.5px;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.st+.st{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.sr:first-child{border-top:0;padding-top:0}.sr:last-child{padding-bottom:0}
.sd{font-weight:800;min-width:150px;display:flex;gap:8px}.sd span{color:var(--mute);font-weight:600}
.sr .c{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12.5px;border-radius:8px;padding:3px 8px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tag b{font-weight:800}
.tag.tbd{background:var(--amber);border-color:var(--amberline);color:var(--amberink)}
/* tab bar */
/* calendar */
.cal{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px 12px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cw span{text-align:center;font-size:12px;font-weight:800;color:var(--mute);padding:2px 0 6px}
.cd{position:relative;min-height:58px;border:0;border-radius:11px;background:none;padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.cd b{font-size:15px;font-weight:750;line-height:26px;min-width:26px;height:26px;border-radius:50%;font-variant-numeric:tabular-nums}
.cd.we{background:var(--soft)}
.cd.out b{opacity:.4}.cd.out .bars,.cd.out .ofl{opacity:.7}
.cd.past:not(.out) b{color:var(--mute)}
.cd.tdy b{background:var(--green);color:#fff}
.cd.sel{box-shadow:inset 0 0 0 2px var(--green2);background:color-mix(in srgb,var(--green2) 9%,transparent)}
.bars{display:flex;flex-direction:column;gap:3px;width:100%;align-items:center}
.bars i{display:block;width:82%;height:6px;border-radius:3px}
.more{font-size:10.5px;font-weight:800;color:var(--mute);line-height:1}
.ofl{font-size:11px;font-weight:800;color:var(--amberink);background:var(--amber);border-radius:6px;padding:1px 5px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lg{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:650;max-width:100%}
.lg i,.sw{flex:none;width:11px;height:11px;border-radius:3px;display:inline-block}
.sw{margin-right:7px;vertical-align:1px}
.wk .mt{font-weight:500;font-size:13px;color:#9aa69d}
.wk .jt{width:auto;height:auto;border:0;background:none;display:inline;padding:0;font-size:13px;font-weight:700;color:#9cc4a8;text-decoration:underline;text-underline-offset:2px}
.pw{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--tint);border:1px solid var(--tintline);color:var(--tintink)}
.pw svg{flex:none}
.pw .pwk{font-size:14px;font-weight:700}
.pw b{margin-left:auto;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--ink)}
.pw small{font-size:13px;font-weight:700;margin-left:1px}
.pill.pwp{background:var(--tint);border-color:var(--tintline);color:var(--tintink)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + var(--sab))}
.tabbar button{flex:1;max-width:150px;min-height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:750;color:var(--mute);border-radius:12px}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar button[aria-current=page] svg{color:var(--green2)}
/* who are you */
.who{min-height:100vh;background:var(--band);color:#eef2ee;padding:calc(var(--sat) + 40px) 0 40px}
.who .logo{font-size:34px}
.who h1{font-size:26px;margin:36px 0 6px;font-weight:850}
.who p{color:#aab5ad;margin:0 0 16px}
.who button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:58px;margin-top:8px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-weight:750;font-size:17px;padding:0 16px}
.who button span{color:#9aa69d;font-weight:600;font-size:14px}
.who .btn{margin-top:8px}
.lk{display:flex;gap:10px;align-items:center;margin-top:26px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#cfd8d1;font-weight:650}
.lk svg{color:#9cc4a8;flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,30px);opacity:0;transition:.25s;z-index:30;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 16px;font-size:14.5px;max-width:calc(100% - 28px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* sheet */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:min(640px,100%);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--sab));max-height:90vh;overflow:auto}
.sheet h2{margin:0;font-size:21px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 4px}
.done{min-height:44px;padding:0 4px 0 12px;border:0;background:none;color:var(--green2);font-weight:800;font-size:16px}
.sheet .btn{width:100%;margin-top:10px}
.sheet ol{padding-left:20px;margin:6px 0 0;font-size:14.5px;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){
  #app.nv-push>*{animation:pushIn .34s cubic-bezier(.2,.8,.2,1) both}
  #app.nv-pop>*{animation:popIn .3s cubic-bezier(.2,.8,.2,1) both}
  #app.nv-tab>main{animation:in .26s ease-out both}
  #app.nv-next>main{animation:pushIn .3s cubic-bezier(.2,.8,.2,1) both}
  #app.nv-prev>main{animation:popIn .3s cubic-bezier(.2,.8,.2,1) both}
  button,a.btn,label.ck{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .15s,box-shadow .15s,opacity .15s}
  .press{transform:scale(.95)}.btn.press,.fab.press{transform:scale(.96)}.pick .press,.lg.press,.seg2 .press,.seg .press{transform:scale(.93)}
  .jl.press,.as.press,button.st.press,.dno.press{transform:scale(.985)}.cd.press{transform:scale(.9)}
  .ov.anim{animation:ovIn .22s ease-out both}.ov.anim .sheet{animation:sheetUp .34s cubic-bezier(.2,.85,.25,1) both}
  .ov.out{animation:ovOut .2s ease-in both}.ov.out .sheet{animation:sheetDown .22s cubic-bezier(.4,0,.8,.4) both}
  .chg.glow{animation:glow 1.1s ease-out 2}
  .rv{animation:none;opacity:0;transform:translate3d(0,34px,0) scale(.97)}
  .rv.in{opacity:1;transform:none;transition:opacity .5s ease-out,transform .7s cubic-bezier(.16,.84,.24,1)}
  .band .topo,.band>.w{will-change:transform}}
main{position:relative;z-index:1}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes pushIn{from{opacity:0;transform:translate3d(42px,0,0)}}
@keyframes popIn{from{opacity:0;transform:translate3d(-32px,0,0)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(224,165,38,.7)}100%{box-shadow:0 0 0 12px rgba(224,165,38,0)}}
@keyframes ovIn{from{background:rgba(0,0,0,0)}}@keyframes ovOut{to{background:rgba(0,0,0,0)}}@keyframes sheetUp{from{transform:translate3d(0,100%,0)}}@keyframes sheetDown{to{transform:translate3d(0,100%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.ctag{font-size:11.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--amberink);background:var(--amber);border:1px solid var(--amberline);border-radius:999px;padding:1px 8px}
.kick .ctag{margin-left:2px}
.dh .ctag{margin-left:auto;align-self:center}.dh .ctag+em{margin-left:6px}
.cd.chg{box-shadow:inset 0 0 0 2px var(--amberline)}
.cd.sel.chg{box-shadow:inset 0 0 0 2px var(--green2)}
.day.chg:not(.now){border-color:var(--amberline)}
#ptr{position:fixed;left:50%;top:calc(var(--sat) + 8px);z-index:25;transform:translate3d(-50%,-70px,0);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#ptr.drag{transition:none}
#ptr .pi{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--mute);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18)}
#ptr.ready .pi,#ptr.spin .pi{color:var(--green2)}
#ptr .arc{position:absolute;inset:4px;border-radius:50%;border:2.5px solid transparent;border-top-color:currentColor;border-right-color:currentColor}
#ptr.spin .arc{animation:spin .8s linear infinite}
html{overscroll-behavior-y:none}
/* weather */
.wx{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:15px;color:var(--mute)}
.wx svg{color:var(--ink)}.wx b{color:var(--ink);font-size:16px}
.wxp{display:inline-flex;align-items:center;gap:2px;margin-left:4px}
.wx em,.wd.warn small{font-style:normal;font-weight:800;font-size:12.5px;color:var(--amberink);background:var(--amber);border:1px solid var(--amberline);border-radius:999px;padding:2px 8px}
.wxs{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--mute);margin-left:auto;padding-left:6px}
.wxs.warn{color:var(--amberink)}
.wxd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:10px 6px;gap:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px;font-size:14px}
.wd b{font-size:13px;color:var(--mute)}.wd span{font-weight:800}.wd i{font-style:normal;color:var(--mute);font-weight:600}
.wd small{font-size:12.5px;color:var(--mute);font-weight:700}
.wd.warn{background:var(--amber)}.wd.warn small{padding:1px 6px}
.wxn{font-size:13px;color:var(--mute);margin:8px 4px 0}
/* editing */
.has-fab main{padding-bottom:150px}
.fab{position:fixed;right:16px;bottom:calc(76px + var(--sab));z-index:9;display:flex;align-items:center;gap:6px;min-height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--green);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.as.ed{grid-template-columns:62px minmax(0,1fr) 22px}
.as.ed .pen{grid-column:3;grid-row:1;color:var(--mute);align-self:center}
.as.ed .c,.as.ed .x{grid-column:2}
.dno{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;text-align:left;font:inherit;color:var(--mute)}
.sheet.ed{display:flex;flex-direction:column;gap:12px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg2 button{min-height:42px;border:0;border-radius:9px;background:none;font-weight:800;font-size:15px;color:var(--mute)}
.seg2 [aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:800;color:var(--mute)}
.fl input,.fl select,.fl textarea{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%;box-sizing:border-box}
.fl textarea{padding:12px;min-height:0;resize:none}
.ck{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-height:32px}
.ck input{width:22px;height:22px;accent-color:var(--green)}.ck small{color:var(--mute);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--soft);font-weight:800;font-size:15px;color:var(--ink)}
.pick [aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.hint{margin:0;font-size:14px;color:var(--amberink);background:var(--amber);border:1px solid var(--amberline);border-radius:12px;padding:10px 12px}
.ferr{margin:0;color:#b3261e;font-weight:700;font-size:14.5px}
.sheet.ed .btns{margin-top:4px}.sheet.ed .btns.one{grid-template-columns:1fr}.sheet.ed .btn{margin-top:0}
.btn.del{color:#b3261e}
.lnk{border:0;background:none;color:var(--green2);font-weight:800;font-size:15px;min-height:40px}
@media(prefers-color-scheme:dark){.ferr,.btn.del{color:#f2a49c}}
/* job editing */
.jtop{display:flex;align-items:center;justify-content:space-between}
.edb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.22);background:rgba(20,24,21,.78);color:#e9ede9;font-weight:800;font-size:14.5px}
.sech{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 0}.sech .sec{margin:0}
.addl{border:0;background:none;color:var(--green2);font-weight:800;font-size:15px;min-height:40px;padding:0 2px}
button.st{display:block;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:none;padding-left:0;padding-right:28px;position:relative;font:inherit;color:inherit}
button.st:first-child{border-top:0}
button.st .pen{position:absolute;right:0;top:2px;color:var(--mute)}
button.st+button.st{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sub{margin:-6px 0 0;color:var(--mute);font-size:14.5px}.sub b{color:var(--ink)}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* smoother taps */
html{touch-action:manipulation}
html.locked,html.locked body{overflow:hidden}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ov.out{pointer-events:none}
.jl.press,.as.press,button.st.press,.dno.press,.lg.press{background-color:var(--soft)}
.tabbar button{transition:color .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
button:disabled{opacity:.6}
@media(prefers-reduced-motion:reduce){.press{opacity:.7}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabs" hidden aria-label="Sections">
  <button data-tab="today" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Today</button>
  <button data-tab="week"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Week</button>
  <button data-tab="cal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>Calendar</button>
  <button data-tab="jobs"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h16v11H4z"/><path d="M9 8.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v2.5M4 13h16"/></svg>Jobs</button>
</nav>
<div id="sheet"></div>
<script src="app.js"></script>
</body>
</html>
